steps:
  # Build Docker image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/task-mcp-server:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/task-mcp-server:latest'
      - '.'
  
  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/task-mcp-server:$COMMIT_SHA'
  
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/task-mcp-server:latest'
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'task-mcp-server'
      - '--image=gcr.io/$PROJECT_ID/task-mcp-server:$COMMIT_SHA'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=60s'
      - '--set-env-vars=NODE_ENV=production'
      - '--update-secrets=FIREBASE_PROJECT_ID=task-firebase-project-id:latest,FIREBASE_SERVICE_ACCOUNT_JSON=task-firebase-service-account-json:latest,TASK_MCP_USER_ID=task-mcp-user-id:latest,TASK_MCP_ACCESS_TOKEN=task-mcp-access-token:latest'

images:
  - 'gcr.io/$PROJECT_ID/task-mcp-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/task-mcp-server:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
